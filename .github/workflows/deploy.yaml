name: Deploy Chatbot to Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull your code from GitHub onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using the secrets you set up
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build the Dockerfile and push it to your Docker Hub repo
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace 'doctor-chatbot' if your repo name is different
          tags: ${{ secrets.DOCKER_USERNAME }}/doctor-chatbot:latest