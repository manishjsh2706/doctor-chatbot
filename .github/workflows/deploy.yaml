name: Deploy Chatbot to Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull your code from GitHub onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Log in to Docker Hub using the secrets you set up
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build the Dockerfile and push it to your Docker Hub repo
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace 'doctor-chatbot' if your repo name is different
          tags: ${{ secrets.DOCKER_USERNAME }}/doctor-chatbot:latest
    deploy:
        needs: build-and-push
        runs-on: ubuntu-latest
        steps:
          - name: Deploy to Lightsail via SSH
            uses: appleboy/ssh-action@master
            with:
              host: ${{ secrets.LIGHTSAIL_IP }}
              username: ${{ secrets.LIGHTSAIL_USERNAME }}
              key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
              script: |
                # Pull the latest image from Docker Hub
                docker pull ${{ secrets.DOCKER_USERNAME }}/doctor-chatbot:latest
                
                # Stop and remove the old container if it exists
                docker stop chatbot || true
                docker rm chatbot || true
                
                # Run the new container
                docker run -d -p 8000:8000 --name chatbot ${{ secrets.DOCKER_USERNAME }}/doctor-chatbot:latest